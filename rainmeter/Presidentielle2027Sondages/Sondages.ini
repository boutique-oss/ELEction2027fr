; Présidentielle 2027 : sondages, mêmes chiffres que le site (moyenne corrigée des biais d'institut).
; Le skin ne calcule rien : il lit /api/sondages?format=tsv. Adresse déjà réglée, rien à modifier.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=24,24,30,235

[Metadata]
Name=Présidentielle 2027 · Sondages
Author=Présidentielle 2027
Information=1er tour, duels du 2nd tour et instituts retenus, calculés par le site. Clic sur le titre : ouvre le site.
Version=1.0
License=CC BY-SA 4.0 (données Sondax d'après Wikipédia)

[Variables]
Site=__SITE__
Largeur=360
TexteAttente=Chargement des sondages…
TexteErreur=Sondages indisponibles : nouvel essai dans 15 min.
TexteDuels=2nd TOUR
TexteInstituts=INSTITUTS RETENUS (biais corrigé)

[sTexte]
FontFace=Segoe UI
FontColor=245,245,247
AntiAlias=1

; ---------- données ----------

[MesureSondages]
Measure=WebParser
URL=#Site#/api/sondages?format=tsv
RegExp=(?s)^(.*)$
StringIndex=1
CodePage=65001
UpdateRate=900
FinishAction=[!CommandMeasure MesureScript "Maj()"]
OnConnectErrorAction=[!CommandMeasure MesureScript "Erreur()"]
OnRegExpErrorAction=[!CommandMeasure MesureScript "Erreur()"]

[MesureScript]
Measure=Script
ScriptFile=#CURRENTPATH#Sondages.lua

; ---------- affichage ----------

[MeterTitre]
Meter=String
MeterStyle=sTexte
X=14
Y=12
FontSize=12
FontWeight=700
Text=Présidentielle 2027 · 1er tour
LeftMouseUpAction=["#Site#"]

[MeterSous]
Meter=String
MeterStyle=sTexte
X=14
Y=2R
W=(#Largeur#-28)
ClipString=2
FontSize=8
FontColor=174,174,178
Text=#TexteAttente#

